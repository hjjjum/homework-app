<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>우리집 할 일</title>
  <meta name="description" content="가족용 할일 관리 앱" />
  <meta name="theme-color" content="#8FD9EE" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="apple-touch-icon" href="icons/daughter1-180.png" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>우리집 할 일</h1>
    </header>

    <main>
      <p class="hint">쓸 화면을 골라주세요. 휴대폰에서는 각 화면을 열고 홈 화면에 추가하면 앱처럼 쓸 수 있어요.</p>
      <ul class="home-links">
        <li><a class="home-link" href="daughter1.html">첫째 할 일</a></li>
        <li><a class="home-link" href="daughter2.html">둘째 할 일</a></li>
        <li><a class="home-link" href="mom.html">엄마 화면</a></li>
      </ul>
    </main>
  </div>

  <script type="module">
    // PWA 자동 업데이트.
    // 서비스워커가 새 버전을 받아 제어권을 넘겨받으면 화면을 한 번 새로 그린다.
    // 이게 없으면 새 버전이 "다음다음 번에 열 때" 보인다.
    if ("serviceWorker" in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController || reloading) return; // 처음 설치할 때는 새로고침하지 않는다
        // 뭔가 입력하는 중이면 건드리지 않는다 (다음에 열 때 반영된다)
        const el = document.activeElement;
        const typing =
          el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT") && el.value;
        if (typing) return;
        reloading = true;
        location.reload();
      });

      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((reg) => {
            reg.update();
            // 앱으로 돌아올 때마다 새 버전이 있는지 확인한다
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") reg.update();
            });
          })
          .catch((err) => {
            console.warn("[pwa] 서비스워커 등록 실패:", err.message);
          });
      });
    }
  </script>
</body>
</html>
