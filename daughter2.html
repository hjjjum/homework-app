<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>둘째 할 일</title>
  <meta name="description" content="둘째 할 일" />
  <meta name="theme-color" content="#FF9EC4" />
  <link rel="manifest" href="manifest-daughter2.json" />
  <link rel="icon" href="icons/daughter2-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/daughter2-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="둘째 할 일" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme-sticker.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>둘째 할 일</h1>
      <div class="progress">
        <div id="progress-ring"></div>
        <p class="progress-text">
          <span class="progress-count" id="progress-count">0/0 완료</span>
          <span class="progress-percent" id="progress-percent">0%</span>
        </p>
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </header>

    <main>
      <!-- 카테고리 필터 탭은 app.js가 만든다 -->
      <nav class="filters" id="filters" aria-label="카테고리 필터"></nav>

      <section class="add">
        <button type="button" class="btn btn--primary btn--block" id="add-toggle" aria-expanded="false" aria-controls="add-form">
          + 할일 추가
        </button>

        <div class="add-form" id="add-form" hidden>
          <span class="field-label" id="quick-source-label">입력 방법</span>
          <!-- 버튼은 app.js가 js/sources/index.js 목록을 보고 만든다 -->
          <div class="filters" id="quick-source" aria-labelledby="quick-source-label"></div>
          <p class="hint" id="quick-source-hint"></p>

          <label for="quick-input">할 일</label>
          <textarea class="field" id="quick-input" rows="4" placeholder="수학 익힘책 32쪽"></textarea>

          <!-- 캡쳐 이미지에서 글자 읽기 -->
          <div class="ocr-row">
            <input type="file" id="quick-image" accept="image/*" hidden />
            <button type="button" class="btn btn--ghost btn--block" id="quick-ocr-btn">
              캡쳐 이미지에서 글자 읽기
            </button>
          </div>
          <p class="hint" id="quick-ocr-status" hidden></p>

          <span class="field-label" id="quick-category-label">카테고리</span>
          <!-- 칩은 app.js가 채운다 -->
          <div class="chip-group" id="quick-category" aria-labelledby="quick-category-label"></div>

          <label for="quick-date">마감일 (선택)</label>
          <input class="field" type="date" id="quick-date" />

          <div class="add-actions">
            <button type="button" class="btn btn--primary" id="quick-add-btn">추가</button>
            <button type="button" class="btn btn--ghost" id="add-cancel">취소</button>
          </div>
        </div>
      </section>

      <ul class="todo-list" id="active-list"></ul>

      <section id="reward-panel" aria-label="스티커와 연속 달성"></section>

      <section class="completed-section" id="completed-section" hidden>
        <button type="button" class="completed-toggle" id="toggle-completed" aria-expanded="false" aria-controls="completed-list">
          완료한 일
        </button>
        <ul class="todo-list completed" id="completed-list" hidden></ul>
        <button type="button" class="btn" id="delete-completed-btn" hidden>완료 항목 모두 지우기</button>
      </section>

      <p class="status" id="status" role="status" hidden></p>
    </main>
  </div>

  <script type="module">
    import { initApp } from "./js/app.js";
    initApp("daughter2");
  </script>

  <script>
    // PWA: 정적 파일 캐싱. 실패해도 앱 동작에는 영향이 없다.
    // PWA 자동 업데이트.
    // 서비스워커가 새 버전을 받아 제어권을 넘겨받으면 화면을 한 번 새로 그린다.
    // 이게 없으면 새 버전이 "다음다음 번에 열 때" 보인다.
    if ("serviceWorker" in navigator) {
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;

      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadController || reloading) return; // 처음 설치할 때는 새로고침하지 않는다
        // 뭔가 입력하는 중이면 건드리지 않는다 (다음에 열 때 반영된다)
        const el = document.activeElement;
        const typing =
          el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT") && el.value;
        if (typing) return;
        reloading = true;
        location.reload();
      });

      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./service-worker.js")
          .then((reg) => {
            reg.update();
            // 앱으로 돌아올 때마다 새 버전이 있는지 확인한다
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible") reg.update();
            });
          })
          .catch((err) => {
            console.warn("[pwa] 서비스워커 등록 실패:", err.message);
          });
      });
    }
  </script>
</body>
</html>
